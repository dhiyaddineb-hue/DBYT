name: Dubbing Pipeline

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube URL"
        required: true
        type: string
      target_language:
        description: "Language (ar, fr, en...)"
        default: "ar"
        type: string

permissions:
  contents: write

jobs:
  dub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup yt-dlp
        uses: AnimMouse/setup-yt-dlp@v3

      - name: Setup YouTube cookies (bypass bot check)
        uses: AnimMouse/setup-yt-dlp/cookies@v3
        with:
          cookies: ${{ secrets.YOUTUBE_COOKIES }}

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python -m backend.cli "${{ inputs.youtube_url }}" --target-language "${{ inputs.target_language }}"

      - run: |
          git config user.name "DBYT bot"
          git config user.email "actions@users.noreply.github.com"
          git add workspace && git commit -m "dubbed video" && git push

      - uses: actions/upload-artifact@v4
        with:
          name: dubbed-video
          path: workspace/output/*
