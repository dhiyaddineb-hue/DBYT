name: Dubbing Pipeline

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube URL"
        required: true
        type: string
      target_language:
        description: "Language (ar, fr, en...)"
        default: "ar"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dubbing-${{ github.ref }}
  cancel-in-progress: false

env:
  DBYT_WPC_BROWSER: /usr/bin/google-chrome
  DBYT_COBALT_BROWSER: "1"
  DBYT_COBALT_URL: https://cobalt.tools/

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write YouTube cookies when configured
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail
          cookie_file="$RUNNER_TEMP/youtube-cookies.txt"
          umask 077
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > "$cookie_file"
            echo "YouTube cookies configured ($(wc -l < "$cookie_file") lines)"
            echo "DBYT_YOUTUBE_COOKIES=$cookie_file" >> "$GITHUB_ENV"
          else
            echo "YouTube cookies are not configured; continuing without them"
          fi

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up Node.js for yt-dlp JavaScript support
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Verify browser downloader stack
        run: |
          set -euo pipefail
          node --version
          google-chrome --version
          ffmpeg -version | head -n 1
          python -c "import importlib.metadata as m; import selenium, yt_dlp; print('selenium', m.version('selenium')); print('yt-dlp', yt_dlp.version.__version__); print('wpc', m.version('yt-dlp-getpot-wpc')); print('bgutil', m.version('bgutil-ytdlp-pot-provider')); print('cobalt browser: OK')"

      - name: Start YouTube PO-token provider (fallback)
        run: |
          set -euo pipefail
          provider_dir="$RUNNER_TEMP/bgutil-ytdlp-pot-provider"
          git clone --depth 1 --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$provider_dir"
          (
            cd "$provider_dir/server"
            npm ci --silent
            npx tsc --pretty false
          )
          node "$provider_dir/server/build/main.js" >"$RUNNER_TEMP/bgutil-provider.log" 2>&1 &
          provider_pid=$!
          echo "$provider_pid" > "$RUNNER_TEMP/bgutil-provider.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo "bgutil PO-token provider is ready"
              break
            fi
            if ! kill -0 "$provider_pid" 2>/dev/null; then
              echo "bgutil PO-token provider exited unexpectedly"
              cat "$RUNNER_TEMP/bgutil-provider.log"
              exit 1
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:4416/ping >/dev/null 2>&1; then
            echo "bgutil PO-token provider did not become ready"
            cat "$RUNNER_TEMP/bgutil-provider.log"
            exit 1
          fi

      - name: Run dubbing pipeline
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          TARGET_LANGUAGE: ${{ inputs.target_language }}
          DBYT_YOUTUBE_PROXIES: ${{ secrets.YOUTUBE_PROXIES }}
        run: python -m backend.cli "$YOUTUBE_URL" --target-language "$TARGET_LANGUAGE"

      - name: Commit generated workspace output
        run: |
          set -euo pipefail
          git config user.name "DBYT bot"
          git config user.email "actions@users.noreply.github.com"
          git add workspace
          if git diff --cached --quiet; then
            echo "No workspace changes to commit"
          else
            git commit -m "dubbed video"
            git push
          fi

      - name: Upload dubbed output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dubbed-video-${{ github.run_id }}
          path: workspace/output
          if-no-files-found: warn
          retention-days: 7
