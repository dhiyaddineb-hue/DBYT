name: One-click YouTube to GitHub dubbing

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "YouTube URL or public direct video URL"
        required: true
        type: string
      target_language:
        description: "Target language"
        required: true
        default: "ar"
        type: string
      project_name:
        description: "Output file name without extension"
        required: true
        default: "dbyt-project"
        type: string
      whisper_model:
        description: "Whisper model for GitHub CPU dubbing"
        required: true
        default: "tiny"
        type: choice
        options:
          - tiny
          - base
          - small

permissions:
  contents: write

env:
  SOURCE_URL: ${{ inputs.source_url }}
  TARGET_LANGUAGE: ${{ inputs.target_language }}
  PROJECT_NAME: ${{ inputs.project_name }}
  WHISPER_MODEL: ${{ inputs.whisper_model }}
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KAGGLE_KERNEL_ID: ${{ secrets.KAGGLE_KERNEL_ID }}
  DBYT_REPOSITORY: ${{ github.repository }}
  DBYT_REF: ${{ github.sha }}

concurrency:
  group: dbyt-youtube-to-github-${{ github.repository }}
  cancel-in-progress: false

jobs:
  download-on-kaggle:
    name: Download source on Kaggle
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      source_asset_api_url: ${{ steps.publish_source.outputs.source_asset_api_url }}
      source_release_id: ${{ steps.publish_source.outputs.source_release_id }}
      source_release_tag: ${{ steps.publish_source.outputs.source_release_tag }}
    steps:
      - name: Check out DBYT
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Kaggle authentication
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || {
            echo "Missing repository secret KAGGLE_API_TOKEN. Add it once from https://www.kaggle.com/settings/api."
            exit 1
          }
          [[ "$SOURCE_URL" =~ ^https?:// ]] || { echo "source_url must be an http(s) URL"; exit 1; }

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade pip kaggle

      - name: Resolve Kaggle kernel id
        run: |
          set -euo pipefail
          kernel_id="${KAGGLE_KERNEL_ID:-}"
          if [ -z "$kernel_id" ]; then
            kernel_refs="$(kaggle kernels list --mine --csv --page-size 1 2>/dev/null || true)"
            username="$(printf '%s\n' "$kernel_refs" | awk -F',' 'NR > 1 && $1 ~ /^[^,[:space:]]+\/[^,[:space:]]+$/ { split($1, parts, "/"); print parts[1]; exit }')"
            if [ -z "$username" ]; then
              echo "Kaggle username could not be discovered. Create one private Kaggle Notebook or add KAGGLE_KERNEL_ID=username/dbyt-youtube-download."
              exit 1
            fi
            kernel_id="$username/dbyt-youtube-download"
          fi
          if [[ ! "$kernel_id" =~ ^[^/[:space:]]+/[^/[:space:]]+$ ]]; then
            echo "KAGGLE_KERNEL_ID must be username/kernel-slug"
            exit 1
          fi
          echo "KAGGLE_KERNEL_ID=$kernel_id" >> "$GITHUB_ENV"
          echo "Using Kaggle download kernel: $kernel_id"

      - name: Prepare download-only Kaggle kernel
        env:
          KAGGLE_KERNEL_DIR: ${{ runner.temp }}/dbyt-download-kernel
        run: |
          set -euo pipefail
          python tools/build_kaggle_download_kernel.py
          test -s "$KAGGLE_KERNEL_DIR/dbyt_youtube_download.ipynb"
          test -s "$KAGGLE_KERNEL_DIR/kernel-metadata.json"

      - name: Start Kaggle download
        env:
          KAGGLE_KERNEL_DIR: ${{ runner.temp }}/dbyt-download-kernel
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dbyt-download-status"
          kaggle kernels push \
            --path "$KAGGLE_KERNEL_DIR" \
            --timeout 7200 \
            2>&1 | tee "$RUNNER_TEMP/dbyt-download-status/push.log"

      - name: Wait for Kaggle download
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/dbyt-download-status/status.log"
          final_status=""
          for attempt in $(seq 1 240); do
            status_output="$(kaggle kernels status "$KAGGLE_KERNEL_ID" 2>&1 || true)"
            printf '[%s] %s\n' "$attempt" "$status_output" | tee -a "$status_file"
            if printf '%s' "$status_output" | grep -Eiq 'complete|success|succeeded'; then
              final_status="complete"
              break
            fi
            if printf '%s' "$status_output" | grep -Eiq 'error|failed|cancelled|canceled'; then
              mkdir -p "$RUNNER_TEMP/dbyt-download-output"
              kaggle kernels output "$KAGGLE_KERNEL_ID" \
                --path "$RUNNER_TEMP/dbyt-download-output" \
                --force 2>&1 || true
              find "$RUNNER_TEMP/dbyt-download-output" -maxdepth 2 -type f -ls || true
              for diagnostic in "$RUNNER_TEMP/dbyt-download-output"/*; do
                if [ -f "$diagnostic" ]; then
                  echo "===== Kaggle diagnostic: $(basename "$diagnostic") ====="
                  tail -200 "$diagnostic" || true
                fi
              done
              final_status="failed"
              break
            fi
            sleep 30
          done
          test "$final_status" = complete || {
            echo "Kaggle download did not complete successfully."
            exit 1
          }

      - name: Download source from Kaggle output
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/dbyt-download-output"
          mkdir -p "$RUNNER_TEMP/dbyt-download-output"
          kaggle kernels output "$KAGGLE_KERNEL_ID" \
            --path "$RUNNER_TEMP/dbyt-download-output" \
            --force
          source_file="$(find "$RUNNER_TEMP/dbyt-download-output" -type f -name 'source.mp4' -print -quit)"
          test -n "$source_file" || {
            echo "Kaggle completed without source.mp4. Download diagnostics:"
            find "$RUNNER_TEMP/dbyt-download-output" -maxdepth 2 -type f -ls || true
            exit 1
          }
          mkdir -p source-handoff
          cp "$source_file" source-handoff/source.mp4
          find "$RUNNER_TEMP/dbyt-download-output" -type f -name 'run.json' -exec cp {} source-handoff/download.json \;
          find "$RUNNER_TEMP/dbyt-download-output" -type f -name 'download.log' -exec cp {} source-handoff/download.log \;
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 source-handoff/source.mp4

      - name: Publish source to GitHub Release
        id: publish_source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="dbyt-source-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DBYT source ${GITHUB_RUN_NUMBER}" \
            --notes "Source downloaded automatically on Kaggle from the workflow input URL. The next job will process source.mp4." \
            source-handoff/*
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          asset_api_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "source.mp4") | .url')"
          test -n "$release_id" -a "$release_id" != null
          test -n "$asset_api_url" -a "$asset_api_url" != null
          echo "source_asset_api_url=$asset_api_url" >> "$GITHUB_OUTPUT"
          echo "source_release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "source_release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Source handoff published to GitHub Release: $tag"

      - name: Upload download diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbyt-download-${{ github.run_id }}
          path: |
            source-handoff
            ${{ runner.temp }}/dbyt-download-status
            ${{ runner.temp }}/dbyt-download-output
            ${{ runner.temp }}/dbyt-download-kernel
          if-no-files-found: warn
          retention-days: 7

  dub-on-github:
    name: Dub source on GitHub CPU
    needs: download-on-kaggle
    if: needs.download-on-kaggle.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ASSET_API_URL: ${{ needs.download-on-kaggle.outputs.source_asset_api_url }}
      SOURCE_RELEASE_ID: ${{ needs.download-on-kaggle.outputs.source_release_id }}
      SOURCE_RELEASE_TAG: ${{ needs.download-on-kaggle.outputs.source_release_tag }}
      DBYT_WHISPER_MODEL: ${{ inputs.whisper_model }}
      DBYT_WHISPER_DEVICE: cpu
      DBYT_WHISPER_COMPUTE_TYPE: int8
      DBYT_DEFAULT_ENGINE: sherpa
    steps:
      - name: Check out DBYT
        uses: actions/checkout@v4

      - name: Install media and Python dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download source handoff from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p workspace/incoming
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ASSET_API_URL" -o workspace/incoming/source.mp4
          test -s workspace/incoming/source.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 workspace/incoming/source.mp4

      - name: Run DBYT dubbing on GitHub CPU
        run: |
          set -euo pipefail
          safe_project="$(printf '%s' "$PROJECT_NAME" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^[.-]*//; s/[.-]*$//' | cut -c1-80)"
          safe_project="${safe_project:-dbyt-project}"
          python -u -m backend.cli workspace/incoming/source.mp4 \
            --target-language "$TARGET_LANGUAGE" \
            --engine sherpa \
            --project-name "$safe_project" \
            --keep-background true \
            --preserve-emotions true \
            --granularity segment \
            --lip-sync false \
            --output-dir workspace/output
          video="$(find workspace/output -type f \( -iname '*.mp4' -o -iname '*.mp3' \) -print -quit)"
          test -n "$video" || { echo "DBYT completed without a dubbed media file."; exit 1; }
          mkdir -p final-output
          cp "$video" "final-output/$(basename "$video")"
          cat > final-output/run.json <<EOF
          {
            "route": "kaggle-download-to-github-cpu-dub",
            "target_language": "${TARGET_LANGUAGE}",
            "whisper_model": "${DBYT_WHISPER_MODEL}",
            "whisper_device": "${DBYT_WHISPER_DEVICE}",
            "whisper_compute_type": "${DBYT_WHISPER_COMPUTE_TYPE}",
            "engine": "sherpa",
            "granularity": "segment"
          }
          EOF

      - name: Publish dubbed result and remove source handoff
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="dbyt-result-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DBYT result ${GITHUB_RUN_NUMBER}" \
            --notes "Kaggle downloaded the source automatically; GitHub CPU completed DBYT dubbing with Sherpa." \
            final-output/*
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$SOURCE_RELEASE_ID"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$SOURCE_RELEASE_TAG" || true
          echo "Dubbed result published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"

      - name: Upload dubbing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbyt-dubbing-${{ github.run_id }}
          path: |
            final-output
            workspace/logs
          if-no-files-found: warn
          retention-days: 7
