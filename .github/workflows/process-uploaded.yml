name: Process Colab upload

on:
  repository_dispatch:
    types: [dbyt_video_uploaded]
  workflow_dispatch:
    inputs:
      asset_api_url:
        description: "Private GitHub Release asset API URL"
        required: true
        type: string
      target_language:
        description: "Language (ar, fr, en...)"
        default: "ar"
        required: true
        type: string
      project_name:
        description: "Output project name"
        default: "dbyt-project"
        required: true
        type: string
      release_id:
        description: "Temporary release ID (optional cleanup)"
        required: false
        type: string
      release_tag:
        description: "Temporary release tag (optional cleanup)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dbyt-upload-${{ github.repository }}
  cancel-in-progress: false

env:
  ASSET_API_URL: ${{ github.event.client_payload.asset_api_url || inputs.asset_api_url }}
  TARGET_LANGUAGE: ${{ github.event.client_payload.target_language || inputs.target_language }}
  PROJECT_NAME: ${{ github.event.client_payload.project_name || inputs.project_name }}
  RELEASE_ID: ${{ github.event.client_payload.release_id || inputs.release_id }}
  RELEASE_TAG: ${{ github.event.client_payload.release_tag || inputs.release_tag }}
  DBYT_COBALT_BROWSER: "0"
  DBYT_DEFAULT_ENGINE: "sherpa"
  DBYT_WHISPER_MODEL: "tiny"
  DBYT_WHISPER_DEVICE: "cpu"
  DBYT_WHISPER_COMPUTE_TYPE: "int8"
  DBYT_WPC_BROWSER: /usr/bin/google-chrome

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Download private Colab asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ASSET_API_URL"
          mkdir -p workspace/incoming
          source_path="workspace/incoming/source.mp4"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ASSET_API_URL" -o "$source_path"
          test -s "$source_path"
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 "$source_path"
          echo "Source asset downloaded from GitHub Release storage"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Verify offline TTS
        run: python -c "import sherpa_onnx; print('sherpa-onnx', sherpa_onnx.__file__)"

      - name: Run dubbing pipeline on local source
        run: |
          set -euo pipefail
          python -u -m backend.cli \
            workspace/incoming/source.mp4 \
            --target-language "$TARGET_LANGUAGE" \
            --engine sherpa \
            --project-name "$PROJECT_NAME" \
            --granularity segment \
            --output-dir workspace/output

      - name: Remove temporary source before commit
        if: success()
        run: rm -rf workspace/incoming

      - name: Commit generated workspace output
        if: success()
        run: |
          set -euo pipefail
          git config user.name "DBYT bot"
          git config user.email "actions@users.noreply.github.com"
          git add workspace
          if git diff --cached --quiet; then
            echo "No workspace changes to commit"
          else
            git commit -m "chore(dub): process Colab upload [skip ci]"
            git push
          fi

      - name: Delete temporary release
        if: success() && env.RELEASE_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          if [ -n "$RELEASE_TAG" ]; then
            curl --fail --silent --show-error \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" || true
          fi
          echo "Temporary release removed"

      - name: Upload dubbed output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dubbed-colab-upload-${{ github.run_id }}
          path: |
            workspace/output
            workspace/logs
            workspace/incoming
          if-no-files-found: warn
          retention-days: 7
