name: Self-hosted one-click YouTube dubbing

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "YouTube URL or public direct video URL"
        required: true
        type: string
      target_language:
        description: "Target language"
        required: true
        default: "ar"
        type: string
      project_name:
        description: "Output file name without extension"
        required: true
        default: "dbyt-project"
        type: string
      tts_engine:
        description: "TTS engine"
        required: true
        default: "sherpa"
        type: choice
        options:
          - sherpa
          - fasih
      reference_url:
        description: "Direct reference audio URL; required for fasih"
        required: false
        default: ""
        type: string
      whisper_model:
        description: "Whisper model"
        required: true
        default: "tiny"
        type: choice
        options:
          - tiny
          - base
          - small
      granularity:
        description: "TTS unit size"
        required: true
        default: "segment"
        type: choice
        options:
          - segment
          - word

permissions:
  contents: write

concurrency:
  group: dbyt-self-hosted-${{ github.repository }}
  cancel-in-progress: false

env:
  SOURCE_URL: ${{ inputs.source_url }}
  TARGET_LANGUAGE: ${{ inputs.target_language }}
  PROJECT_NAME: ${{ inputs.project_name }}
  TTS_ENGINE: ${{ inputs.tts_engine }}
  WHISPER_MODEL: ${{ inputs.whisper_model }}
  GRANULARITY: ${{ inputs.granularity }}
  REFERENCE_URL: ${{ inputs.reference_url }}
  DBYT_WHISPER_DEVICE: cpu
  DBYT_WHISPER_COMPUTE_TYPE: int8
  DBYT_DEFAULT_ENGINE: ${{ inputs.tts_engine }}
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

jobs:
  dub:
    name: Download and dub on personal runner
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    steps:
      - name: Check out DBYT
        uses: actions/checkout@v4

      - name: Install system and Python dependencies
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            if ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq --no-install-recommends ffmpeg
            fi
          fi
          command -v ffmpeg >/dev/null 2>&1 || { echo "ffmpeg is required on the self-hosted runner."; exit 1; }
          if [ "$TTS_ENGINE" = "fasih" ] && [ -z "$REFERENCE_URL" ]; then
            echo "reference_url is required when tts_engine=fasih."
            exit 1
          fi
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user -r requirements.txt
          if [ "$TTS_ENGINE" = "fasih" ]; then
            python3 -m pip install --user --upgrade coqui-tts==0.27.5 transformers==5.0.0
          fi

      - name: Install Deno for yt-dlp
        run: |
          set -euo pipefail
          deno_root="$RUNNER_TEMP/dbyt-deno"
          mkdir -p "$deno_root"
          if [ ! -x "$deno_root/bin/deno" ]; then
            DENO_INSTALL="$deno_root" CI=1 curl -fsSL https://deno.land/install.sh | sh
          fi
          test -x "$deno_root/bin/deno"
          echo "DENO_PATH=$deno_root/bin/deno" >> "$GITHUB_ENV"
          echo "$deno_root/bin" >> "$GITHUB_PATH"

      - name: Download source on the personal runner
        run: |
          set -euo pipefail
          mkdir -p workspace/incoming
          if [[ "$SOURCE_URL" =~ ^https://(www\.)?(youtube\.com|youtu\.be)/ ]]; then
            cookies_args=()
            if [ -n "${YOUTUBE_COOKIES:-}" ]; then
              umask 077
              cookie_file="$RUNNER_TEMP/dbyt-youtube-cookies.txt"
              printf '%s\n' "$YOUTUBE_COOKIES" > "$cookie_file"
              cookies_args=(--cookies "$cookie_file")
              echo "YouTube cookies enabled; value hidden."
            fi
            download_ok=false
            for cookie_mode in with without; do
              if [ "$cookie_mode" = with ] && [ "${#cookies_args[@]}" -eq 0 ]; then
                continue
              fi
              for format_value in \
                'bv*[height<=720]+ba/b[height<=720]/best' \
                'best'; do
                rm -f workspace/incoming/source.*
                command=(yt-dlp --ignore-config --no-playlist --retries 5 --fragment-retries 5
                  --socket-timeout 30 --js-runtimes "deno:$DENO_PATH"
                  --remote-components ejs:github --merge-output-format mp4)
                if [ "$cookie_mode" = with ]; then
                  command+=("${cookies_args[@]}")
                fi
                command+=(--format "$format_value" --output 'workspace/incoming/source.%(ext)s' "$SOURCE_URL")
                echo "yt-dlp attempt cookies=$cookie_mode format=$format_value"
                if "${command[@]}"; then
                  download_ok=true
                  break 2
                fi
              done
            done
            test "$download_ok" = true || { echo "YouTube download failed on the self-hosted runner."; exit 1; }
          else
            curl --fail --location --retry 3 \
              -A 'DBYT-self-hosted/1.0' "$SOURCE_URL" \
              -o workspace/incoming/source.mp4
          fi
          source_file="$(find workspace/incoming -maxdepth 1 -type f \( -iname 'source.mp4' -o -iname 'source.mkv' -o -iname 'source.webm' \) -print -quit)"
          test -n "$source_file" || { echo "No source media was downloaded."; exit 1; }
          if [ "$source_file" != "workspace/incoming/source.mp4" ]; then
            ffmpeg -y -i "$source_file" -c copy workspace/incoming/source.mp4
          fi
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 workspace/incoming/source.mp4

      - name: Prepare Fasih reference audio
        run: |
          set -euo pipefail
          if [ "$TTS_ENGINE" != "fasih" ]; then
            exit 0
          fi
          mkdir -p workspace/reference
          curl --fail --location --retry 3 "$REFERENCE_URL" -o workspace/reference/reference.wav
          test -s workspace/reference/reference.wav
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 workspace/reference/reference.wav
          echo "REFERENCE_PATH=$GITHUB_WORKSPACE/workspace/reference/reference.wav" >> "$GITHUB_ENV"

      - name: Run DBYT dubbing
        run: |
          set -euo pipefail
          safe_project="$(printf '%s' "$PROJECT_NAME" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^[.-]*//; s/[.-]*$//' | cut -c1-80)"
          safe_project="${safe_project:-dbyt-project}"
          cli_args=(python3 -u -m backend.cli workspace/incoming/source.mp4
            --target-language "$TARGET_LANGUAGE"
            --engine "$TTS_ENGINE"
            --project-name "$safe_project")
          if [ "$TTS_ENGINE" = "fasih" ]; then
            cli_args+=(--voice "$REFERENCE_PATH")
          fi
          cli_args+=(
            --keep-background true
            --preserve-emotions true
            --granularity "$GRANULARITY"
            --lip-sync false
            --output-dir workspace/output
          )
          "${cli_args[@]}"
          video="$(find workspace/output -type f \( -iname '*.mp4' -o -iname '*.mp3' \) -print -quit)"
          test -n "$video" || { echo "DBYT completed without a dubbed media file."; exit 1; }
          mkdir -p final-output
          cp "$video" "final-output/$(basename "$video")"
          cat > final-output/run.json <<EOF
          {
            "route": "self-hosted-runner",
            "target_language": "${TARGET_LANGUAGE}",
            "engine": "${TTS_ENGINE}",
            "whisper_model": "${WHISPER_MODEL}",
            "whisper_device": "${DBYT_WHISPER_DEVICE}",
            "whisper_compute_type": "${DBYT_WHISPER_COMPUTE_TYPE}",
            "granularity": "${GRANULARITY}"
          }
          EOF

      - name: Publish dubbed result to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="dbyt-self-hosted-result-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DBYT dubbed result ${GITHUB_RUN_NUMBER}" \
            --notes "Downloaded and dubbed on the user's self-hosted runner." \
            final-output/*
          echo "Final Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbyt-self-hosted-${{ github.run_id }}
          path: |
            workspace/logs
            workspace/incoming
            final-output
          if-no-files-found: warn
          retention-days: 7
