services:
  dbyt:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DBYT_HOST: 0.0.0.0
      DBYT_PORT: 8000
      DBYT_COBALT_BROWSER: ${DBYT_COBALT_BROWSER:-false}
    expose:
      - "8000"
    volumes:
      - ../workspace:/app/workspace
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    environment:
      DBYT_DOMAIN: ${DBYT_DOMAIN:?Set DBYT_DOMAIN in .env}
      TLS_EMAIL: ${TLS_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      dbyt:
        condition: service_healthy
    restart: unless-stopped
    init: true

volumes:
  caddy_data:
  caddy_config:
