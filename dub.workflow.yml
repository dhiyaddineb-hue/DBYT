name: Dubbing Pipeline

# =============================================================================
# The pipeline runs on GITHUB's servers (this IS "GitHub as the workspace"):
#   - always available (GitHub is always on)
#   - triggered on demand (workflow_dispatch), on a schedule, or by an
#     issue/PR comment `dub <url> <lang>`
#   - writes the dubbed output back into the repository under workspace/output/
#     and uploads it as an artifact
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube URL to dub"
        required: false
        type: string
      target_language:
        description: "Target language (ar, fr, en, es, de, ...)"
        required: true
        default: "ar"
        type: string
      engine:
        description: "TTS engine (edge | elevenlabs)"
        required: false
        default: "edge"
        type: string
      project_name:
        description: "Project name (auto-filled from title if empty)"
        required: false
        type: string
      lip_sync:
        description: "Re-animate the mouth (Wav2Lip) — needs GPU"
        required: false
        default: "false"
        type: string
  schedule:
    # Example: run a nightly batch (edit URL list in a jobs file as needed)
    - cron: "0 0 * * *"
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: write

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Determine inputs (from dispatch or issue comment)
        id: inputs
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          URL="${{ inputs.youtube_url }}"
          LANG="${TARGET_LANG:-${{ inputs.target_language }}}"
          ENGINE="${ENGINE:-${{ inputs.engine }}}"
          PROJECT="${{ inputs.project_name }}"
          LIPSYNC="${{ inputs.lip_sync }}"
          # If triggered by an issue comment "dub <url> [lang]"
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            if [[ "$COMMENT_BODY" =~ ^dub[[:space:]]+(.+)$ ]]; then
              REST="${BASH_REMATCH[1]}"
              URL=$(echo "$REST" | awk '{print $1}')
              L2=$(echo "$REST" | awk '{print $2}')
              LANG="${L2:-ar}"
            fi
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "lang=$LANG" >> "$GITHUB_OUTPUT"
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "lipsync=$LIPSYNC" >> "$GITHUB_OUTPUT"
          if [ -z "$URL" ]; then
            echo "::warning::No YouTube URL provided — skipping (schedule run with no URL)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies (ffmpeg)
        if: steps.inputs.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        if: steps.inputs.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        if: steps.inputs.outputs.skip != 'true'
        run: pip install -r requirements.txt faster-whisper

      - name: Run dubbing pipeline
        if: steps.inputs.outputs.skip != 'true'
        env:
          DBYT_ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DBYT_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m backend.cli "${{ steps.inputs.outputs.url }}" \
            --target-language "${{ steps.inputs.outputs.lang }}" \
            --engine "${{ steps.inputs.outputs.engine }}" \
            --project-name "${{ steps.inputs.outputs.project }}" \
            --lip-sync "${{ steps.inputs.outputs.lipsync }}"

      - name: Persist output in the repository (GitHub = workspace)
        if: steps.inputs.outputs.skip != 'true'
        run: |
          git config user.name "DBYT bot"
          git config user.email "actions@users.noreply.github.com"
          git add workspace || true
          if git diff --cached --quiet; then
            echo "No new output to commit."
          else
            git commit -m "workspace: store dubbing output (${{ steps.inputs.outputs.lang }})"
            git push
          fi

      - name: Upload dubbed video artifact
        if: steps.inputs.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dubbed-video
          path: workspace/output/*
          if-no-files-found: error
